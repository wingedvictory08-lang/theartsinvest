  <style>
    /* ── Landing page ── */

    .landing {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 4rem 2rem 6.5rem;
      overflow: hidden;
    }

    .landing-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: url('studio-bg.jpg') center bottom / cover no-repeat;
    }

    .landing-content {
      position: relative;
      z-index: 1;
      max-width: 600px;
    }

    /* ivory lettering in the site fonts, with a soft navy shadow so it reads over the photo */
    .landing {
      --marker: var(--bg);
    }

    .landing-title {
      font-family: var(--font-heading);
      color: var(--marker);
      text-shadow: 0 1px 3px rgba(27, 42, 74, 0.9), 0 0 12px rgba(27, 42, 74, 0.6);
      font-size: clamp(2.2rem, 5.5vw, 3.6rem);
      font-weight: 400;
      letter-spacing: 0.03em;
      line-height: 1.15;
      margin-bottom: 2.5rem;
    }

    .landing-line {
      width: 50px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 3rem;
    }

    .landing-links {
      display: flex;
      justify-content: center;
      gap: 4rem;
      margin-bottom: 2.2rem;
    }

    .landing-links a {
      font-family: var(--font-heading);
      color: var(--marker);
      text-shadow: 0 1px 3px rgba(27, 42, 74, 0.9), 0 0 12px rgba(27, 42, 74, 0.6);
      /* half the Studio Acquisitions title */
      font-size: clamp(1.1rem, 2.75vw, 1.8rem);
      font-weight: 400;
      letter-spacing: 0.05em;
      text-decoration: none;
      position: relative;
      transition: color 0.3s ease;
    }

    /* thin underline so it reads as a link */
    .landing-links a::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -5px;
      height: 1px;
      background: var(--marker);
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .landing-links a:hover {
      opacity: 0.8;
    }

    .landing-links a:hover::after {
      opacity: 0.9;
    }

    .landing-note {
      font-family: var(--font-body);
      color: var(--marker);
      text-shadow: 0 1px 3px rgba(27, 42, 74, 0.9), 0 0 12px rgba(27, 42, 74, 0.6);
      font-size: clamp(1.1rem, 2.75vw, 1.8rem);
      font-weight: 400;
      letter-spacing: 0.05em;
      opacity: 0.85;
      margin-top: 0;
    }

    /* announcements: the small line opens a preview box */
    .announce {
      position: relative;
      display: inline-block;
    }

    .announce-toggle {
      background: none;
      border: none;
      padding: 0 0 3px;
      cursor: pointer;
      border-bottom: 1px solid var(--gold);
      text-transform: lowercase;
    }

    .announce-toggle:hover,
    .announce-toggle[aria-expanded="true"] {
      opacity: 1;
    }

    .announce-box {
      position: absolute;
      top: calc(100% + 0.9rem);
      left: 50%;
      z-index: 20;
      width: min(340px, calc(100vw - 2.5rem));
      transform: translateX(-50%);
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--gold);
      border-radius: 4px;
      box-shadow: 0 14px 40px rgba(27, 42, 74, 0.25);
      padding: 1.3rem 1.5rem;
      text-align: left;
      animation: announceIn 0.3s ease both;
    }

    .announce-box[hidden] {
      display: none;
    }

    @keyframes announceIn {
      from { opacity: 0; transform: translate(-50%, -6px); }
    }

    .announce-box ul {
      list-style: none;
    }

    .announce-box li {
      font-family: var(--font-body);
      font-size: 0.8rem;
      line-height: 1.6;
      letter-spacing: 0.02em;
      padding: 0.75rem 0;
      border-top: 1px solid rgba(201, 185, 154, 0.5);
    }

    .announce-box li:first-child {
      border-top: none;
      padding-top: 0;
    }

    .announce-box li:last-child {
      padding-bottom: 0;
    }

    .announce-box .announce-lead {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      line-height: 1.35;
      letter-spacing: 0.01em;
    }

    /* homepage nav: the same ivory masthead band, links and lettering as
       every other page, so it reads cleanly over the photo */
    .home-masthead {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      flex-direction: row-reverse;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem clamp(1.2rem, 3vw, 2.5rem);
      background: var(--bg);
    }

    .home-masthead nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem 1.6rem;
    }

    .home-masthead nav a {
      color: var(--text);
    }

    .landing-status {
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: lowercase;
      color: var(--gold);
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .home-masthead {
        flex-direction: column;
        gap: 0.5rem;
        padding: 0.9rem 1rem 0.8rem;
      }

      .home-masthead nav {
        justify-content: center;
        gap: 0.55rem 1.05rem;
      }
    }

    /* ownership line, pinned small to the bottom of the landing */
    .landing-owner {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 1.25rem;
      z-index: 1;
      padding: 0 1.5rem;
      font-family: var(--font-body);
      font-size: 0.6rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--bg);
      text-shadow: 0 1px 3px rgba(27, 42, 74, 0.95), 0 0 10px rgba(27, 42, 74, 0.8);
      opacity: 0.7;
    }

    /* ── Landing fade-in sequencing ── */

    .landing-fade {
      opacity: 0;
      transform: translateY(16px);
      animation: landingIn 0.9s ease forwards;
    }

    .landing-fade:nth-child(1) { animation-delay: 0.15s; }
    .landing-fade:nth-child(2) { animation-delay: 0.4s; }
    .landing-fade:nth-child(3) { animation-delay: 0.6s; }
    .landing-fade:nth-child(4) { animation-delay: 0.85s; }
    .landing-fade:nth-child(5) { animation-delay: 1.05s; }

    @keyframes landingIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .landing {
        padding: 3rem 1.5rem 6.5rem;
      }

      .landing-bg {
        background-size: auto 200%;
      }

      .landing-links {
        gap: 2.5rem;
      }

    }

  </style>

  <script>
    (function () {
      var toggle = document.getElementById('announce-toggle');
      var box = document.getElementById('announce-box');
      function setOpen(open) {
        box.hidden = !open;
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      toggle.addEventListener('click', function (e) {
        e.stopPropagation();
        setOpen(box.hidden);
      });
      document.addEventListener('click', function (e) {
        if (!box.hidden && !box.contains(e.target)) setOpen(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !box.hidden) { setOpen(false); toggle.focus(); }
      });
    })();
  </script>
