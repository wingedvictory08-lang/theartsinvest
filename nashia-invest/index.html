  <style>
    /* ── Landing page ── */

    .landing {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 4rem 2rem 6.5rem;
      overflow: hidden;
    }

    .landing-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: url('studio-bg.jpg') center bottom / cover no-repeat;
    }

    .landing-content {
      position: relative;
      z-index: 1;
      max-width: 600px;
    }

    /* ivory lettering in the site fonts, with a soft navy shadow so it reads over the photo */
    .landing {
      --marker: var(--bg);
    }

    .landing-title {
      font-family: var(--font-heading);
      color: var(--marker);
      text-shadow: 0 1px 3px rgba(27, 42, 74, 0.9), 0 0 12px rgba(27, 42, 74, 0.6);
      font-size: clamp(2.2rem, 5.5vw, 3.6rem);
      font-weight: 400;
      letter-spacing: 0.03em;
      line-height: 1.15;
      margin-bottom: 2.5rem;
    }

    .landing-line {
      width: 50px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 3rem;
    }

    .landing-links {
      display: flex;
      justify-content: center;
      gap: 4rem;
      margin-bottom: 2.2rem;
    }

    .landing-links a {
      font-family: var(--font-heading);
      color: var(--marker);
      text-shadow: 0 1px 3px rgba(27, 42, 74, 0.9), 0 0 12px rgba(27, 42, 74, 0.6);
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-decoration: none;
      position: relative;
      transition: color 0.3s ease;
    }

    /* thin underline so it reads as a link */
    .landing-links a::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -5px;
      height: 1px;
      background: var(--marker);
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .landing-links a:hover {
      opacity: 0.8;
    }

    .landing-links a:hover::after {
      opacity: 0.9;
    }

    .landing-note {
      font-family: var(--font-body);
      color: var(--marker);
      text-shadow: 0 1px 3px rgba(27, 42, 74, 0.9), 0 0 12px rgba(27, 42, 74, 0.6);
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      opacity: 0.85;
      margin-top: 0;
    }

    /* homepage nav: plain navy links with the gold underline, no pills */
    .site-nav-left a,
    .site-nav a.nav-booking {
      background: none;
      padding: 0 0 3px;
      margin: 0;
      border-radius: 0;
      color: var(--text);
      text-shadow: none;
      border-bottom: 1px solid var(--gold);
      opacity: 1;
      transition: border-color 0.3s ease, opacity 0.3s ease;
    }

    .site-nav-left a:hover,
    .site-nav a.nav-booking:hover {
      border-bottom-color: var(--text);
    }

    .site-nav-left {
      gap: 1.4rem;
    }

    /* on phones the top of the photo is the black paper, so navy would
       disappear; keep the links ivory there */
    @media (max-width: 600px) {
      .site-nav-left a,
      .site-nav a.nav-booking {
        color: var(--bg);
        text-shadow: 0 1px 3px rgba(27, 42, 74, 0.9), 0 0 10px rgba(27, 42, 74, 0.6);
      }

      .site-nav-left a:hover,
      .site-nav a.nav-booking:hover {
        border-bottom-color: var(--bg);
      }
    }

    /* availability note sitting just left of the booking pill */
    .landing-nav {
      align-items: center;
      gap: 1rem;
    }

    .landing-status {
      font-family: var(--font-body);
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: lowercase;
      color: var(--bg);
      text-shadow: 0 1px 3px rgba(27, 42, 74, 0.95), 0 0 10px rgba(27, 42, 74, 0.8);
      opacity: 0.85;
      white-space: nowrap;
    }

    /* ownership line, pinned small to the bottom of the landing */
    .landing-owner {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 1.25rem;
      z-index: 1;
      padding: 0 1.5rem;
      font-family: var(--font-body);
      font-size: 0.6rem;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--bg);
      text-shadow: 0 1px 3px rgba(27, 42, 74, 0.95), 0 0 10px rgba(27, 42, 74, 0.8);
      opacity: 0.7;
    }

    /* ── Landing fade-in sequencing ── */

    .landing-fade {
      opacity: 0;
      transform: translateY(16px);
      animation: landingIn 0.9s ease forwards;
    }

    .landing-fade:nth-child(1) { animation-delay: 0.15s; }
    .landing-fade:nth-child(2) { animation-delay: 0.4s; }
    .landing-fade:nth-child(3) { animation-delay: 0.6s; }
    .landing-fade:nth-child(4) { animation-delay: 0.85s; }
    .landing-fade:nth-child(5) { animation-delay: 1.05s; }

    @keyframes landingIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .landing {
        padding: 3rem 1.5rem 6.5rem;
      }

      .landing-bg {
        background-size: auto 200%;
      }

      .landing-links {
        gap: 2.5rem;
      }

      .landing-links a {
        font-size: 1.3rem;
      }

      .landing-note {
        font-size: 0.66rem;
      }

      .landing-status {
        font-size: 0.6rem;
      }
    }

    /* very narrow phones: stack the availability note under the booking
       pill so it clears the faq pill on the left */
    @media (max-width: 410px) {
      .landing-nav {
        flex-direction: column-reverse;
        align-items: flex-end;
        gap: 0.7rem;
      }

      .landing {
        padding-top: 6.5rem;
      }
    }
  </style>
